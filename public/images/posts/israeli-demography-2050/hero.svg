<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600">
  <defs>
    <linearGradient id="bg-demo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="50%" stop-color="#0a0f1f"/>
      <stop offset="100%" stop-color="#0a1428"/>
    </linearGradient>
    <radialGradient id="glow-purple" cx="0.7" cy="0.5">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-cyan" cx="0.25" cy="0.6">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bar-grad-1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0891b2" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="bar-grad-2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#6b21a8" stop-opacity="0.7"/>
    </linearGradient>
    <filter id="neon-demo">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft-glow-demo">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <rect width="1200" height="600" fill="url(#bg-demo)"/>
  <ellipse cx="850" cy="300" rx="500" ry="350" fill="url(#glow-purple)"/>
  <ellipse cx="300" cy="350" rx="380" ry="280" fill="url(#glow-cyan)"/>

  <!-- Grid lines (chart-like) -->
  <g stroke="#1e293b" stroke-width="1" opacity="0.5">
    <line x1="80" y1="480" x2="1120" y2="480"/>
    <line x1="80" y1="400" x2="1120" y2="400"/>
    <line x1="80" y1="320" x2="1120" y2="320"/>
    <line x1="80" y1="240" x2="1120" y2="240"/>
    <line x1="80" y1="160" x2="1120" y2="160"/>
  </g>

  <!-- Year labels -->
  <g font-family="system-ui, sans-serif" font-size="14" fill="#475569" text-anchor="middle">
    <text x="240" y="510">2025</text>
    <text x="720" y="510">2050</text>
  </g>

  <!-- "2025" bars (cyan, present, smaller) -->
  <g filter="url(#soft-glow-demo)" opacity="0.55">
    <rect x="170" y="360" width="36" height="120" fill="url(#bar-grad-1)" rx="3"/>
    <rect x="212" y="320" width="36" height="160" fill="url(#bar-grad-1)" rx="3"/>
    <rect x="254" y="380" width="36" height="100" fill="url(#bar-grad-1)" rx="3"/>
    <rect x="296" y="420" width="36" height="60" fill="url(#bar-grad-1)" rx="3"/>
  </g>
  <g>
    <rect x="170" y="360" width="36" height="120" fill="url(#bar-grad-1)" rx="3"/>
    <rect x="212" y="320" width="36" height="160" fill="url(#bar-grad-1)" rx="3"/>
    <rect x="254" y="380" width="36" height="100" fill="url(#bar-grad-1)" rx="3"/>
    <rect x="296" y="420" width="36" height="60" fill="url(#bar-grad-1)" rx="3"/>
  </g>

  <!-- "2050" bars (purple, future, larger) -->
  <g filter="url(#soft-glow-demo)" opacity="0.55">
    <rect x="650" y="280" width="36" height="200" fill="url(#bar-grad-2)" rx="3"/>
    <rect x="692" y="220" width="36" height="260" fill="url(#bar-grad-2)" rx="3"/>
    <rect x="734" y="300" width="36" height="180" fill="url(#bar-grad-2)" rx="3"/>
    <rect x="776" y="360" width="36" height="120" fill="url(#bar-grad-2)" rx="3"/>
  </g>
  <g>
    <rect x="650" y="280" width="36" height="200" fill="url(#bar-grad-2)" rx="3"/>
    <rect x="692" y="220" width="36" height="260" fill="url(#bar-grad-2)" rx="3"/>
    <rect x="734" y="300" width="36" height="180" fill="url(#bar-grad-2)" rx="3"/>
    <rect x="776" y="360" width="36" height="120" fill="url(#bar-grad-2)" rx="3"/>
  </g>

  <!-- Arrow connecting 2025 → 2050 -->
  <g stroke="#94a3b8" stroke-width="1.4" fill="none" opacity="0.6" stroke-linecap="round">
    <path d="M 360 280 C 460 280 480 250 580 250" stroke-dasharray="6 6"/>
    <path d="M 575 244 L 590 250 L 575 256" stroke-linejoin="round"/>
  </g>

  <!-- Header text -->
  <g font-family="Georgia, serif" filter="url(#neon-demo)">
    <text x="600" y="100" font-size="62" font-weight="700" fill="#f1f5f9" text-anchor="middle">דמוגרפיה ישראלית</text>
    <text x="600" y="160" font-size="120" font-weight="900" fill="#a855f7" text-anchor="middle">2050</text>
    <text x="600" y="160" font-size="120" font-weight="900" fill="none" stroke="#22d3ee" stroke-width="0.6" text-anchor="middle" opacity="0.55">2050</text>
  </g>

  <!-- Sub-stat capsules -->
  <g font-family="system-ui, sans-serif" filter="url(#neon-demo)">
    <g transform="translate(960, 200)">
      <rect x="-95" y="-32" width="190" height="64" rx="14" fill="#0f172a" fill-opacity="0.7" stroke="#22d3ee" stroke-opacity="0.4"/>
      <text x="0" y="-5" font-size="26" font-weight="800" fill="#22d3ee" text-anchor="middle">15.9M</text>
      <text x="0" y="18" font-size="11" fill="#94a3b8" text-anchor="middle">תחזית בינונית 2050</text>
    </g>
    <g transform="translate(960, 290)">
      <rect x="-95" y="-32" width="190" height="64" rx="14" fill="#0f172a" fill-opacity="0.7" stroke="#a855f7" stroke-opacity="0.4"/>
      <text x="0" y="-5" font-size="26" font-weight="800" fill="#a855f7" text-anchor="middle">22%</text>
      <text x="0" y="18" font-size="11" fill="#94a3b8" text-anchor="middle">חרדים מהאוכלוסייה</text>
    </g>
    <g transform="translate(960, 380)">
      <rect x="-95" y="-32" width="190" height="64" rx="14" fill="#0f172a" fill-opacity="0.7" stroke="#fbbf24" stroke-opacity="0.4"/>
      <text x="0" y="-5" font-size="26" font-weight="800" fill="#fbbf24" text-anchor="middle">+113%</text>
      <text x="0" y="18" font-size="11" fill="#94a3b8" text-anchor="middle">גידול אוכלוסיית 65+</text>
    </g>
  </g>

  <!-- Top/bottom decorative lines -->
  <rect x="0" y="50" width="1200" height="2" fill="#22d3ee" opacity="0.3"/>
  <rect x="0" y="548" width="1200" height="2" fill="#a855f7" opacity="0.3"/>
</svg>
